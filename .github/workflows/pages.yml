name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://indicasoftware-content-api-production.up.railway.app' }}
        run: npm run build
      - name: Verify production build
        run: |
          test -f dist/index.html
          grep -q '/indicasoftware/assets/' dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "dist/index.html still references the Vite source entry; refusing to deploy unbuilt source." >&2
            exit 1
          fi
      - name: Exclude PHP files from the static Pages artifact
        run: rm -rf dist/api dist/admin && rm -f dist/bootstrap.php dist/.htaccess
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
